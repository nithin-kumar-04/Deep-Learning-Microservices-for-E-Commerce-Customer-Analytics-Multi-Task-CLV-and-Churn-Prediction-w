name: CI

on:
  push:
    branches: [main, Changes]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: |
          set -o pipefail
          pytest -x -vv --junitxml=junit.xml 2>&1 | tee pytest.log

      - name: Annotate failures
        if: failure()
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for path in glob.glob("junit.xml"):
              for case in ET.parse(path).iter("testcase"):
                  for node in list(case.iter("failure")) + list(case.iter("error")):
                      text = (node.text or node.get("message") or "").strip()
                      tail = text[-800:].replace("\n", " | ")
                      name = f"{case.get('classname')}::{case.get('name')}"
                      print(f"::error title={name}::{tail}")
          PY

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: |
            pytest.log
            junit.xml
          if-no-files-found: ignore

  frontend:
    name: Dashboard (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
